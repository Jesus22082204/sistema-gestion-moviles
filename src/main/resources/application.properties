# ================================================
# Configuración de Spring Boot + MongoDB
# Sistema de Gestión Móviles
# ================================================

# Puerto del servidor (mismo que la API Node.js anterior)
server.port=3001

# ================================================
# MongoDB Configuration
# ================================================
spring.data.mongodb.uri=mongodb://localhost:27017/sistema_gestion_moviles

# Nombre de la aplicación
spring.application.name=sistema-gestion-moviles

# ================================================
# Jackson (JSON) Configuration
# ================================================
# Serializar fechas como strings ISO en vez de timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# ================================================
# Logging
# ================================================
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.sistema.gestion=DEBUG
